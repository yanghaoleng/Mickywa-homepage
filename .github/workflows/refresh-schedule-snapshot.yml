name: Refresh schedule snapshot

on:
  workflow_dispatch:
  schedule:
    # Every 8 hours, avoiding Beijing 02:00-08:00. UTC 00:00/08:00/16:00 = Beijing 08:00/16:00/00:00.
    - cron: '0 0,8,16 * * *'

jobs:
  trigger-vercel-rebuild:
    runs-on: ubuntu-latest
    env:
      VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
    steps:
      - name: Trigger Vercel deploy hook
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "::error::Missing VERCEL_DEPLOY_HOOK_URL secret"
            exit 1
          fi

          curl --fail --silent --show-error --request POST "$VERCEL_DEPLOY_HOOK_URL"
