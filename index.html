<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="/assets/favcon.svg" />
    <title>羊石坨坨</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        var shouldFetch = true;
        try {
          var cached = JSON.parse(localStorage.getItem('mickywa_schedule_cache_v3') || 'null');
          var data = cached && cached.data;
          var ts = Number(data && (data.generatedAtMs || data.calendarFetchedAtMs)) || Number(cached && cached.timestamp) || 0;
          var ageMs = Date.now() - ts;
          shouldFetch = !(data && !data.isMock && Array.isArray(data.schedule) && ageMs >= 0 && ageMs < 120000);
        } catch (_) {}

        if (!shouldFetch) return;
        var preloadUrl = '/schedule-snapshot.json';
        window.__MICKYWA_SCHEDULE_PRELOAD_URL__ = preloadUrl;
        window.__MICKYWA_SCHEDULE_PRELOAD__ = fetch(preloadUrl, {
          headers: { Accept: 'application/json' },
          cache: 'no-cache'
        })
          .then(function (res) {
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.json();
          })
          .catch(function (error) {
            window.__MICKYWA_SCHEDULE_PRELOAD_ERROR__ = error;
            return null;
          });
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
